[package]
name = "herdr-tilt"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A Herdr plugin for controlling and monitoring Tilt"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
nix = { version = "0.30", features = ["signal"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
