name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: herdr-tilt-macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: herdr-tilt-macos-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: herdr-tilt-linux-aarch64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: herdr-tilt-linux-x86_64

    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          cross-version: v0.2.5
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/herdr-tilt" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release payload
        shell: bash
        run: |
          for platform in macos-aarch64 macos-x86_64 linux-aarch64 linux-x86_64; do
            test -f "dist/herdr-tilt-$platform"
            test -f "dist/herdr-tilt-$platform.sha256"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
